<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="uml-panel" x1="120" y1="120" x2="1480" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1F35"/>
      <stop offset="1" stop-color="#091221"/>
    </linearGradient>
    <filter id="uml-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="uml-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1 1L11 7L1 13" stroke="#8FD8FF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="48" width="1480" height="804" rx="38" fill="url(#uml-panel)" stroke="rgba(255,255,255,0.12)"/>

  <text x="120" y="120" fill="#2AFADF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="6">DOMAIN CLASS DIAGRAM</text>
  <text x="120" y="168" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">OOP relationships are strongest inside the battle domain</text>

  <rect x="160" y="220" width="250" height="120" rx="22" fill="#102231" stroke="#2AFADF" filter="url(#uml-shadow)"/>
  <text x="285" y="262" text-anchor="middle" fill="#2AFADF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">&lt;&lt;interface&gt;&gt;</text>
  <text x="285" y="300" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Attackable</text>
  <text x="285" y="328" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="18">receiveDamage, isAlive, getName</text>

  <rect x="520" y="210" width="420" height="230" rx="24" fill="#122640" stroke="#4F8CFF" filter="url(#uml-shadow)"/>
  <text x="730" y="252" text-anchor="middle" fill="#4F8CFF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">&lt;&lt;abstract&gt;&gt;</text>
  <text x="730" y="292" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Character</text>
  <line x1="560" y1="316" x2="900" y2="316" stroke="rgba(255,255,255,0.12)"/>
  <text x="560" y="348" fill="#D8E7F1" font-family="Cascadia Code, Consolas, monospace" font-size="18">- name, hp, maxHp, attackPower, defense</text>
  <text x="560" y="378" fill="#D8E7F1" font-family="Cascadia Code, Consolas, monospace" font-size="18">- attackMultiplier, defenseMultiplier, defending</text>
  <line x1="560" y1="398" x2="900" y2="398" stroke="rgba(255,255,255,0.12)"/>
  <text x="560" y="428" fill="#D8E7F1" font-family="Cascadia Code, Consolas, monospace" font-size="18">+ receiveDamage(), heal(), defend()</text>

  <rect x="1110" y="220" width="250" height="120" rx="22" fill="#102231" stroke="#2AFADF" filter="url(#uml-shadow)"/>
  <text x="1235" y="262" text-anchor="middle" fill="#2AFADF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">&lt;&lt;interface&gt;&gt;</text>
  <text x="1235" y="300" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">SkillUser</text>
  <text x="1235" y="328" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="18">useSkill(Character target)</text>

  <rect x="260" y="520" width="320" height="180" rx="22" fill="#122640" stroke="#FFD166" filter="url(#uml-shadow)"/>
  <text x="420" y="566" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Player</text>
  <text x="420" y="602" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="19">level, experience, score, potionCount</text>
  <text x="420" y="632" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="19">attack(), useSkill(), gainExperience()</text>
  <text x="420" y="668" text-anchor="middle" fill="#DFFFF9" font-family="Segoe UI, Arial, sans-serif" font-size="18">implements SkillUser</text>

  <rect x="670" y="500" width="360" height="170" rx="22" fill="#122640" stroke="#FFD166" filter="url(#uml-shadow)"/>
  <text x="850" y="544" text-anchor="middle" fill="#FFD166" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">&lt;&lt;abstract&gt;&gt;</text>
  <text x="850" y="584" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Enemy</text>
  <text x="850" y="620" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="19">rewardExperience, rewardScore</text>
  <text x="850" y="648" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="19">shared reward semantics</text>

  <rect x="1120" y="470" width="190" height="120" rx="20" fill="#0F2732" stroke="#2AFADF" filter="url(#uml-shadow)"/>
  <text x="1215" y="518" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Goblin</text>
  <text x="1215" y="548" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="18">attack + useSkill</text>

  <rect x="1320" y="620" width="190" height="120" rx="20" fill="#0F2732" stroke="#4F8CFF" filter="url(#uml-shadow)"/>
  <text x="1415" y="668" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">DragonBoss</text>
  <text x="1415" y="698" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="18">attack + useSkill</text>

  <rect x="1040" y="660" width="210" height="110" rx="20" fill="#0F2732" stroke="#FF9B71" filter="url(#uml-shadow)"/>
  <text x="1145" y="705" text-anchor="middle" fill="#EEF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">OrcWarrior</text>
  <text x="1145" y="733" text-anchor="middle" fill="#9FB6C8" font-family="Segoe UI, Arial, sans-serif" font-size="18">attack override only</text>

  <path d="M410 280H520" stroke="#8FD8FF" stroke-width="4" marker-end="url(#uml-arrow)"/>
  <path d="M940 280H1110" stroke="#8FD8FF" stroke-width="4" marker-end="url(#uml-arrow)"/>
  <path d="M730 440V500" stroke="#8FD8FF" stroke-width="4" marker-end="url(#uml-arrow)"/>
  <path d="M560 440L450 520" stroke="#8FD8FF" stroke-width="4" marker-end="url(#uml-arrow)"/>
  <path d="M970 612L1120 540" stroke="#8FD8FF" stroke-width="4" marker-end="url(#uml-arrow)"/>
  <path d="M1010 646L1320 680" stroke="#8FD8FF" stroke-width="4" marker-end="url(#uml-arrow)"/>
  <path d="M930 670L1040 700" stroke="#8FD8FF" stroke-width="4" marker-end="url(#uml-arrow)"/>
  <path d="M580 590L1110 340" stroke="rgba(42,250,223,0.45)" stroke-width="3" stroke-dasharray="12 10"/>
  <path d="M1310 530L1260 340" stroke="rgba(42,250,223,0.45)" stroke-width="3" stroke-dasharray="12 10"/>
  <path d="M1450 620L1270 340" stroke="rgba(42,250,223,0.45)" stroke-width="3" stroke-dasharray="12 10"/>

  <rect x="150" y="760" width="1300" height="60" rx="18" fill="rgba(42,250,223,0.08)" stroke="rgba(42,250,223,0.32)"/>
  <text x="800" y="798" text-anchor="middle" fill="#DFFFF9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Design takeaway: state is inherited from abstract parents, while optional skills are modeled through interface contracts instead of forcing every enemy into the same behavior set.</text>
</svg>
